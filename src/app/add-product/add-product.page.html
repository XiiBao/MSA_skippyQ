<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Add New Product</ion-title>
    <ion-buttons slot="start">
      <ion-back-button></ion-back-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Add New Product</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-button expand="block" color="secondary" (click)="add()">ADD</ion-button>
</ion-content>
